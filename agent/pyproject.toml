[project]
name = "fleet-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Srujana Bollina", email = "srujana.678@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.4",
]

[project.scripts]
fleet-agent = "fleet_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
